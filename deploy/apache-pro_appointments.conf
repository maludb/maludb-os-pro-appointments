# Pro Appointments beside the Business OS kernel — rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = appointments.<domain>, {{APP_DIR}} = /srv/apps/pro_appointments, {{APP_INTERNAL_PORT}} from config/.env.
# A standalone install writes its own vhost (README).

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/pro_appointments-error.log
	CustomLog ${APACHE_LOG_DIR}/pro_appointments-access.log combined
	# Behind the business's TLS proxy: the session cookie is Secure
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	RewriteEngine On
	# The kernel's sign-on and sign-out receivers, and the health check
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]
	RewriteRule ^/api/v1/health$ /api/v1/health.php [L,QSA]
	# Local sign-in is closed while OS_ENABLED is on; / goes straight to the app (which sends a visitor to the launcher)
	RewriteRule ^/$ /app.php [L,R=302]
</VirtualHost>

# The loopback port, for the kernel's own calls (health; the installer's checks).
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/pro_appointments-error.log
	CustomLog ${APACHE_LOG_DIR}/pro_appointments-access.log combined
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health$ /api/v1/health.php [L,QSA]
</VirtualHost>
